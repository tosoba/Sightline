name: iosApp
options:
  bundleIdPrefix: com.trm.sightline
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 7.0.0
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # Copied from core/ui/src/main/res/raw by the :syncIosMapStyles Gradle task.
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: MapLibre
        product: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trm.sightline
        PRODUCT_NAME: Sightline
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        OTHER_LDFLAGS:
          - $(inherited)
          - -framework
          - Shared
          - -framework
          - CoreLocation
          - -framework
          - AVFoundation
          - -framework
          - CoreVideo
          - -framework
          - CoreMotion
          - -framework
          - CoreMedia
          - -framework
          - Metal
          - -framework
          - MetalKit
    preBuildScripts:
      - name: Build Shared framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :syncIosMapStyles :shared:embedAndSignAppleFrameworkForXcode
  iosAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: iosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trm.sightline.uitests
        TEST_TARGET_NAME: iosApp
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        SWIFT_VERSION: "5.0"
schemes:
  iosApp:
    build:
      targets:
        iosApp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - iosAppUITests

